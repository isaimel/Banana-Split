<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Banana Split</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="hcommand:workbench.trust.managettps://fonts.googleapis.com/css2?family=Danfo&family=Luckiest+Guy&family=Ribeye+Marrow&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.ico">
    <script type="module" src="script.js"></script>

</head>

<body>
    <div id="game-header">
        <b><div id="game-title">BANANA SPLITS</div></b>
        <div id="game-description">Click the banana to try and split it as evenly as possible.</div>
    </div>
    <div id="game-container">
        <div id="banana-img-container">
            <div id="game-component">
                <div id="game-piece"><b>↓</b></div>
            </div>
            <img id="primary-banana" class="banana-img">
            <img id="first-half" class="banana-img">
            <img id="second-half" class="banana-img">

        </div>
        <div id="banana-score">0.0%</div>
        <button id="reset-button">Reset</button>
    </div>
    <div id="banana-identifiers">
        <div id="banana-name"></div>
        <hr>
        <div id="banana-description"></div>
    </div>
    <i><div id="pun-container"></div></i>

</body>

</html>
